<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Notes</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      #dot,
      .ring {
        position: fixed;
        left: 0;
        top: 0;
        border-radius: 50%;
        pointer-events: none;
      }
      #dot {
        width: 18px;
        height: 18px;
        margin: -9px 0 0 -9px;
        background: radial-gradient(circle, #fff 0 18%, #ff2d2d 40%, rgb(255 45 45 / 0.6) 70%, transparent 72%);
        box-shadow: 0 0 14px 6px rgb(255 45 45 / 0.55);
        opacity: 0;
        transition: opacity 200ms;
      }
      #dot.on {
        opacity: 1;
      }
      .ring {
        width: 48px;
        height: 48px;
        margin: -24px 0 0 -24px;
        border: 3px solid #ff2d2d;
        animation: ping 600ms ease-out forwards;
      }
      @keyframes ping {
        from {
          transform: scale(0.3);
          opacity: 1;
        }
        to {
          transform: scale(1.4);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="dot"></div>
    <script type="module" src="/src/overlay.ts"></script>
  </body>
</html>
